{% extends "base.html" %}

{% block content %}
  <a href="{% url 'lesson_detail' lesson.slug %}" class="text-blue-500 hover:underline">&larr; Back to Lesson</a>

  <div class="mt-6 p-6 bg-white shadow-lg rounded-lg">
    <h2 class="text-2xl font-bold">Quiz for {{ lesson.title }}</h2>
    <p class="text-gray-600">Answer the questions below and submit your answers.</p>

    <form method="POST">
      {% csrf_token %}
      {% for question in questions %}
        <div class="mt-4 p-4 bg-gray-100 rounded">
          <p class="font-semibold">{{ forloop.counter }}. {{ question.question_text }}</p>
          
          <label class="block mt-2">
            <input type="radio" name="{{ question.id }}" value="option_1"> A) {{ question.option_1 }}
          </label>
          <label class="block mt-2">
            <input type="radio" name="{{ question.id }}" value="option_2"> B) {{ question.option_2 }}
          </label>
          <label class="block mt-2">
            <input type="radio" name="{{ question.id }}" value="option_3"> C) {{ question.option_3 }}
          </label>
          <label class="block mt-2">
            <input type="radio" name="{{ question.id }}" value="option_4"> D) {{ question.option_4 }}
          </label>
        </div>
      {% endfor %}

      <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded mt-4">Submit Quiz</button>
    </form>
  </div>
{% endblock %}
