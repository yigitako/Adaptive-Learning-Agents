<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Quiz</title>
</head>
<body>
    <h2>{{ question.question_text }}</h2>
    <form method="post">
        {% csrf_token %}
        {% for option in question.options %}
            <div>
                <input type="radio" id="option{{ forloop.counter }}" name="selected_option" value="{{ option }}" required>
                <label for="option{{ forloop.counter }}">{{ option }}</label>
            </div>
        {% endfor %}
        <div>
            <label for="explanation">Explain your reasoning:</label><br>
            <textarea name="explanation" id="explanation" rows="5" cols="50"></textarea>
        </div>
        <button type="submit">Submit Answer</button>
    </form>
</body>
</html>
