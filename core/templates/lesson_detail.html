{% extends "base.html" %}

{% block content %}
  <a href="{% url 'home' %}" class="text-blue-500 hover:underline">&larr; Back to Lessons</a>

  <div class="mt-6 p-6 bg-white shadow-lg rounded-lg">
    <h2 class="text-2xl font-bold">{{ lesson.title }}</h2>
    <p class="text-gray-600"><strong>Topic:</strong> {{ lesson.topic }}</p>
    
    <div class="mt-4 p-4 bg-gray-100 rounded">
      <p>{{ lesson.content }}</p>
    </div>

    {% if lesson.example_problem %}
      <div class="mt-4 p-4 bg-gray-200 rounded">
        <strong>Example Problem:</strong>
        <p>{{ lesson.example_problem }}</p>
      </div>
    {% endif %}
  </div>
{% endblock %}
